# Server
server.port=8080

# Logging
logging.level.com.resumeiq=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO

# Firebase
# You can override these via environment variables FIREBASE_PROJECT_ID and FIREBASE_CREDENTIALS_PATH
firebase.project-id=${FIREBASE_PROJECT_ID:resumeiq-08}
firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:}

# AI Service
# Override via AI_SERVICE_URL
ai.service.url=${AI_SERVICE_URL:http://localhost:9000}

# File Upload limits (max 10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
